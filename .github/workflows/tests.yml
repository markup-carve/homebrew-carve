name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  # Style, audit and - on a pull request that touches the formula - a real
  # install plus the `test do` block, the way Homebrew's own taps are checked.
  test-bot:
    name: test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    # Nothing declared a timeout, so the default was 360 minutes. An install
    # that falls through to a source build hangs for hours instead of failing:
    # crv2pdf built CPython with PGO on an Intel mac for over half an hour.
    timeout-minutes: 20
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

  # test-bot only exercises a formula a pull request CHANGED, so a release that
  # rewrites `Formula/carve.rb` from the carve-rs workflow - which is how every
  # version lands here - would otherwise never be installed by anything before
  # a user does it. This job installs whatever the formula currently pins, on
  # each of the four platforms it has a URL for.
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    # Nothing declared a timeout, so the default was 360 minutes. An install
    # that falls through to a source build hangs for hours instead of failing:
    # crv2pdf built CPython with PGO on an Intel mac for over half an hour.
    timeout-minutes: 20
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-homebrew checks the tap out under the Homebrew prefix at this
      # ref, so no actions/checkout is needed - and adding one breaks, because
      # it cannot re-clone over the git config setup-homebrew leaves behind.
      - name: Install carve
        run: brew install --verbose markup-carve/carve/carve

      - name: Render a document end to end
        run: |
          printf '# Hello\n' > sample.crv
          carve sample.crv
          carve sample.crv | grep -q '<h1'

      - name: Uninstall carve
        run: brew uninstall carve

      - name: Install crv2pdf
        run: brew install --verbose markup-carve/carve/crv2pdf

      # Markdown, not PDF: PDF wants Chrome and two pip packages, and what this
      # job is for is proving the engine the formula stages is reachable.
      - name: Render a document to Markdown end to end
        run: |
          printf '# Hello\n' > sample.crv
          crv2pdf --md sample.crv out.md
          grep -q Hello out.md
          crv2pdf --version

      - name: Uninstall crv2pdf
        run: brew uninstall crv2pdf
